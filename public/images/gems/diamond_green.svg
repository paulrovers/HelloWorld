<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aaf8ca"/>
      <stop offset="1" stop-color="#50eb91"/>
    </linearGradient>
    <linearGradient id="crownL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50eb91"/>
      <stop offset="1" stop-color="#11d462"/>
    </linearGradient>
    <linearGradient id="crownR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11d462"/>
      <stop offset="1" stop-color="#089b45"/>
    </linearGradient>
    <linearGradient id="pavC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50eb91"/>
      <stop offset="0.75" stop-color="#11d462"/>
      <stop offset="1" stop-color="#089b45"/>
    </linearGradient>
    <linearGradient id="pavL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11d462"/>
      <stop offset="1" stop-color="#056a2f"/>
    </linearGradient>
    <linearGradient id="pavR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#089b45"/>
      <stop offset="1" stop-color="#056a2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="50" cy="93" rx="26" ry="4.5" fill="#000000" opacity="0.18"/>

  <!-- pavilion (bottom) facets -->
  <polygon points="13,34 38,34 50,90" fill="url(#pavL)"/>
  <polygon points="38,34 62,34 50,90" fill="url(#pavC)"/>
  <polygon points="62,34 87,34 50,90" fill="url(#pavR)"/>

  <!-- crown (top) facets -->
  <polygon points="31,10 13,34 38,34" fill="url(#crownL)"/>
  <polygon points="31,10 69,10 62,34 38,34" fill="url(#table)"/>
  <polygon points="69,10 87,34 62,34" fill="url(#crownR)"/>

  <!-- inner facet edges -->
  <g stroke="#024f22" stroke-width="0.8" stroke-linejoin="round" fill="none" opacity="0.55">
    <polyline points="31,10 38,34 50,90"/>
    <polyline points="69,10 62,34 50,90"/>
    <line x1="13" y1="34" x2="87" y2="34"/>
  </g>

  <!-- outline -->
  <polygon points="31,10 69,10 87,34 50,90 13,34" fill="none"
           stroke="#024f22" stroke-width="2" stroke-linejoin="round"/>

  <!-- glass sheen -->
  <polygon points="31,10 69,10 87,34 50,90 13,34" fill="url(#glow)"/>
  <polygon points="36,14 48,14 30,31 24,26" fill="#ffffff" opacity="0.65"/>
  <polygon points="55,14 61,14 42,42 39,36" fill="#ffffff" opacity="0.35"/>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M 71 22 L 72.6 26.4 L 77 28 L 72.6 29.6 L 71 34 L 69.4 29.6 L 65 28 L 69.4 26.4 Z" opacity="0.95"/>
    <path d="M 33 47 L 34.1 50 L 37 51 L 34.1 52.1 L 33 55 L 31.9 52.1 L 29 51 L 31.9 50 Z" opacity="0.8"/>
    <circle cx="58" cy="60" r="1.4" opacity="0.6"/>
  </g>
</svg>